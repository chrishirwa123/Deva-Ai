<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Deva AI{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <button data-sidebar-toggle class="btn-ghost btn-icon" style="margin-right:2px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand-orb"></div>
      <div class="brand-text">Deva AI</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-item" id="nav-new-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span class="sidebar-label">New Chat</span>
      </div>
      <a class="sidebar-item {{ 'active' if active_page=='assistant' }}" href="/assistant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="9" opacity=".4"/></svg>
        <span class="sidebar-label">Deva Assistant</span>
      </a>
      <a class="sidebar-item {{ 'active' if active_page=='research' }}" href="/research">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span class="sidebar-label">Research</span>
      </a>
      <a class="sidebar-item {{ 'active' if active_page=='knowledge' }}" href="/knowledge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="sidebar-label">Knowledge Library</span>
      </a>
      <a class="sidebar-item {{ 'active' if active_page=='memory' }}" href="/memory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 2A5.5 5.5 0 0 0 4 7.5c0 1.5.5 2.5 1.5 3.5L12 17l6.5-6c1-1 1.5-2 1.5-3.5A5.5 5.5 0 0 0 14.5 2c-1.7 0-3 .7-4 2a5.4 5.4 0 0 0-1-2z" opacity=".85"/></svg>
        <span class="sidebar-label">Personal Memory</span>
      </a>
      <a class="sidebar-item {{ 'active' if active_page=='profile' }}" href="/profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
        <span class="sidebar-label">Owner Profile</span>
      </a>
      <a class="sidebar-item {{ 'active' if active_page=='settings' }}" href="/settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.4.66.74.85.34.19.6.5.74.85"/></svg>
        <span class="sidebar-label">Settings</span>
      </a>
    </div>

    <div class="conv-list" id="conv-list"></div>

    <div class="sidebar-footer">
      <a href="/" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg><span class="sidebar-label">Landing Page</span></a>
    </div>
  </aside>

  <div class="main-panel">
    {% block content %}{% endblock %}
  </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
async function loadConversationList(activeId) {
  const list = document.getElementById('conv-list');
  if (!list) return;
  try {
    const convos = await Deva.api('/api/conversations');
    list.innerHTML = convos.map(c => `
      <div class="conv-item ${activeId == c.id ? 'active' : ''}" data-id="${c.id}">
        <span class="conv-title" style="overflow:hidden;text-overflow:ellipsis;">${Deva.escapeHtml(c.title)}</span>
        <span class="conv-actions">
          <button data-action="rename" title="Rename"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button data-action="delete" title="Delete"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
        </span>
      </div>`).join('') || '<div style="padding:14px;color:var(--text-2);font-size:12.5px;">No conversations yet</div>';

    list.querySelectorAll('.conv-item').forEach(item => {
      item.addEventListener('click', (e) => {
        if (e.target.closest('.conv-actions')) return;
        window.location.href = `/chat/${item.dataset.id}`;
      });
    });
    list.querySelectorAll('[data-action="rename"]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const item = btn.closest('.conv-item');
        const title = prompt('Rename conversation:');
        if (!title) return;
        await Deva.api(`/api/conversations/${item.dataset.id}`, { method: 'PATCH', body: { title } });
        loadConversationList(activeId);
      });
    });
    list.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const item = btn.closest('.conv-item');
        if (!confirm('Delete this conversation?')) return;
        await Deva.api(`/api/conversations/${item.dataset.id}`, { method: 'DELETE' });
        if (String(activeId) === item.dataset.id) window.location.href = '/chat';
        else loadConversationList(activeId);
      });
    });
  } catch (e) {
    list.innerHTML = '<div style="padding:14px;color:var(--danger);font-size:12.5px;">Could not load conversations</div>';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const newChatBtn = document.getElementById('nav-new-chat');
  if (newChatBtn) {
    newChatBtn.addEventListener('click', async () => {
      const conv = await Deva.api('/api/conversations', { method: 'POST' });
      window.location.href = `/chat/${conv.id}`;
    });
  }
  loadConversationList(window.DEVA_CONV_ID || null);
});
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
